# Template only — DO NOT fill in real values here. These are binary Excel
# files, not simple key=value pairs, so create the real Secret with kubectl
# --from-file instead of applying a filled-in copy of this manifest (the
# Jenkinsfile does this automatically each run from a Jenkins Secret file
# credential):
#
#   kubectl create secret generic leaftaps-data -n leaftaps \
#     --from-file="Login.xlsx=data/Login.xlsx" \
#     --from-file="CreateLead.xlsx=data/CreateLead.xlsx" \
#     --from-file="EditLead.xlsx=data/EditLead.xlsx" \
#     --from-file="DeleteLead.xlsx=data/DeleteLead.xlsx" \
#     --from-file="DuplicateLead.xlsx=data/DuplicateLead.xlsx"
#
# These are the Excel data-provider fixtures TC001_Verify/TC003_CreateLead/etc
# read via DataLibrary.readExcelData(...) — see Leaftaps/.gitignore ("#secrets")
# for why they're never committed.
apiVersion: v1
kind: Secret
metadata:
  name: leaftaps-data
  namespace: leaftaps
type: Opaque
data:
  Login.xlsx: ""
  CreateLead.xlsx: ""
  EditLead.xlsx: ""
  DeleteLead.xlsx: ""
  DuplicateLead.xlsx: ""
