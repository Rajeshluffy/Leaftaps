# One-shot Job — runs the Leaftaps Selenium suite to completion and exits.
#
# Prerequisites before `kubectl apply -f k8s/`:
#   1. Build the image from ../Dockerfile (see its header comment) and load
#      it into the cluster (the Jenkinsfile does this via `docker save` +
#      `docker load` into the Minikube node — no external registry needed).
#   2. Apply namespace.yaml first.
#   3. Create the leaftaps-data Secret described in
#      leaftaps-data-secret.example.yaml's header comment.
#
# image: is rewritten by the Jenkinsfile (sed) from the "latest" placeholder
# below to leaftaps-tests:${BUILD_ID} before every apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: leaftaps-test-job
  namespace: leaftaps
  labels:
    app: leaftaps-test
spec:
  # Single attempt, no retries — a flaky UI test retrying itself via k8s Job
  # semantics would just mask real failures; retries belong at the
  # TestNG/RetryEngine layer (already built into autoFrameX), not here.
  backoffLimit: 0
  # Auto-delete the Job (and its Pod) 1 hour after it finishes, so results
  # don't pile up — extract reports before this fires.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: leaftaps-test
    spec:
      restartPolicy: Never
      containers:
        - name: leaftaps-test
          image: leaftaps-tests:latest   # REPLACED by Jenkinsfile via sed
          imagePullPolicy: Never
          # OVERRIDING entrypoint to copy read-only secrets into the writable workspace first
          #
          # NOTE: no "clean" goal here on purpose — target/surefire-reports is a
          # K8s hostPath mount point (see volumeMounts below); maven-clean-plugin
          # cannot delete a mount point itself, only its contents, so "mvn clean
          # test" fails every run before any test executes. Each pod is a fresh
          # container anyway, so there's nothing to clean.
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /app/Leaftaps/data
              cp /mnt/secrets/* /app/Leaftaps/data/
              mvn test -Dsurefire.suiteXmlFiles=${SUITE_FILE}
          env:
            - name: BROWSER
              value: "chrome"
            - name: ENVIRONMENT
              value: "qa"
            - name: HEADLESS
              value: "true"
            - name: SUITE_FILE
              value: "src/test/resources/suites/regression.xml"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: test-reports
              mountPath: /app/Leaftaps/target/surefire-reports
            # 1. Mount secrets to a temporary read-only path
            - name: leaftaps-data-temp
              mountPath: /mnt/secrets
              readOnly: true
            # 2. Mount shared memory to prevent Chrome DevToolsActivePort crashes
            - name: dshm
              mountPath: /dev/shm
      volumes:
        # hostPath on the Minikube node — the Jenkinsfile pulls reports out
        # via `docker exec minikube tar -c -C /tmp surefire-reports`, so it
        # must stay in sync with that command's path.
        - name: test-reports
          hostPath:
            path: /tmp/surefire-reports
            type: DirectoryOrCreate
        - name: leaftaps-data-temp
          secret:
            secretName: leaftaps-data
        # Shared memory volume for Dockerized Chrome
        - name: dshm
          emptyDir:
            medium: Memory