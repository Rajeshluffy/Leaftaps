# Selenium Grid 4 (Hub + Chrome node + Firefox node) — shared infra, deployed
# once and left running, separate from the per-run leaftaps-test-job.
#
# Namespace is deliberately separate from "leaftaps": this is shared infra a
# test Job connects OUT to, not something scoped to one test run.
#
# Sizing note: this minikube node is 4 CPU / 6GB total, and has already
# OOM-crashed once under load this session. Requests below are kept
# conservative on purpose — Kubernetes only blocks scheduling on requests,
# not limits, so as long as requests stay well under node capacity there's
# headroom for the test pod to run alongside Grid without a repeat crash.
# If you see real memory pressure once this is running, lower Chrome/Firefox
# node replica count to 1 each before lowering their individual limits —
# a browser process needs real memory to render pages reliably.
apiVersion: v1
kind: Namespace
metadata:
  name: selenium-grid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-hub
  namespace: selenium-grid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selenium-hub
  template:
    metadata:
      labels:
        app: selenium-hub
    spec:
      containers:
        - name: selenium-hub
          image: selenium/hub:4.27.0
          ports:
            - containerPort: 4442
            - containerPort: 4443
            - containerPort: 4444
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /wd/hub/status
              port: 4444
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: selenium-hub
  namespace: selenium-grid
spec:
  selector:
    app: selenium-hub
  ports:
    - name: event-bus-publish
      port: 4442
      targetPort: 4442
    - name: event-bus-subscribe
      port: 4443
      targetPort: 4443
    - name: hub
      port: 4444
      targetPort: 4444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-chrome-node
  namespace: selenium-grid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selenium-chrome-node
  template:
    metadata:
      labels:
        app: selenium-chrome-node
    spec:
      containers:
        - name: chrome-node
          image: selenium/node-chrome:4.27.0
          env:
            - name: SE_EVENT_BUS_HOST
              value: "selenium-hub"
            - name: SE_EVENT_BUS_PUBLISH_PORT
              value: "4442"
            - name: SE_EVENT_BUS_SUBSCRIBE_PORT
              value: "4443"
            - name: SE_NODE_MAX_SESSIONS
              value: "1"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        # Same fix already proven necessary for headless Chrome in this repo's
        # own test-job.yaml — without it Chrome crashes with
        # "session not created: unable to connect to renderer".
        - name: dshm
          emptyDir:
            medium: Memory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-firefox-node
  namespace: selenium-grid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selenium-firefox-node
  template:
    metadata:
      labels:
        app: selenium-firefox-node
    spec:
      containers:
        - name: firefox-node
          image: selenium/node-firefox:4.27.0
          env:
            - name: SE_EVENT_BUS_HOST
              value: "selenium-hub"
            - name: SE_EVENT_BUS_PUBLISH_PORT
              value: "4442"
            - name: SE_EVENT_BUS_SUBSCRIBE_PORT
              value: "4443"
            - name: SE_NODE_MAX_SESSIONS
              value: "1"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
